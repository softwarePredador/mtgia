<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BrewTact · Menu da mesa · Vitral</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian-950:#0B0D12; --obsidian-900:#151821; --slate-850:#1D222C; --slate-750:#293041;
  --ivory:#F3EFE3; --mist:#B8C0CC; --mist-dim:#8A93A3;
  --brass-400:#E0A93B; --brass-500:#C58B2A; --frost-400:#6FA8DC; --danger:#FF8A80;
  --brasa:#B5402B; --ambar:#94621A; --musgo:#3E7A4C; --mare:#1F6F8C; --indigo:#3B4699; --ameixa:#7A3B86;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:874px;height:402px;overflow:hidden;background:var(--obsidian-950);color:var(--ivory);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:874px;height:402px;overflow:hidden}
.mesa{position:absolute;inset:0;background:url("../ref/nossa-mesa-874x402.png") center/100% 100% no-repeat;
  filter:blur(2px) brightness(.46) saturate(.85)}
body[data-state="jogadores"] .mesa{filter:blur(5px) brightness(.3) saturate(.8)}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(11,13,18,.15),rgba(11,13,18,.62))}
.view{position:absolute;left:62px;right:62px;top:21px;bottom:21px;display:none}
body[data-state="menu"] #v-menu, body[data-state="jogadores"] #v-jogadores{display:flex}

/* ---------- azulejo de vitral ---------- */
.t{--c:var(--mare);position:relative;overflow:hidden;border-radius:22px;padding:13px 14px 12px;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
  background:linear-gradient(158deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 42%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(243,239,227,.17),inset 0 1.5px 0 rgba(255,255,255,.30),inset 0 -10px 22px rgba(0,0,0,.16),
    0 10px 22px rgba(0,0,0,.5),0 0 0 3px rgba(11,13,18,.85)}
.t::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.13) 0 34%,transparent 34.2%),
             linear-gradient(200deg,transparent 0 72%,rgba(0,0,0,.10) 72.2%)}
.t>*{position:relative}
.brasa{--c:var(--brasa)}.ambar{--c:var(--ambar)}.musgo{--c:var(--musgo)}.mare{--c:var(--mare)}.indigo{--c:var(--indigo)}.ameixa{--c:var(--ameixa)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.lb{font-weight:800;font-size:11.5px;line-height:1.18;letter-spacing:.085em;text-transform:uppercase;color:var(--ivory);
  text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lb .off{opacity:.45}
.sub{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,239,227,.72)}
.ic{width:38px;height:38px;flex:none;fill:none;stroke:var(--ivory);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ic .f{fill:var(--ivory)}
.num{font-family:Fraunces,serif;font-weight:700;font-variation-settings:"opsz" 144;line-height:.8;color:var(--ivory);
  text-shadow:0 3px 8px rgba(0,0,0,.35);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;
  background:rgba(11,13,18,.55);font-weight:800;font-size:12px;color:var(--ivory)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c2,var(--ambar));box-shadow:0 0 0 1.5px rgba(243,239,227,.85)}

/* ---------- menu ---------- */
#v-menu{flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.row.r1,.row.r3{height:112px}.row.r2{height:120px}
.f1{flex:1 1 0}.f2{flex:2 1 0}
.r2 .hero{width:335px;flex:none}.r2 .gap{width:80px;flex:none;margin:0 -8px}.r2 .half{flex:1 1 0}

.hero{background:linear-gradient(158deg,#F4CB6C 0%,var(--brass-400) 40%,var(--brass-500) 100%);color:var(--obsidian-950);
  flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:12px 16px 12px 18px}
.hero .turno{display:flex;flex-direction:column;align-items:center;gap:7px}
.hero .turno .sub{color:rgba(11,13,18,.7)}
.hero .num{color:var(--obsidian-950);font-size:78px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.hero .mid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;padding-left:14px;border-left:2px solid rgba(11,13,18,.18)}
.hero .lb{color:var(--obsidian-950);text-shadow:none;font-size:12px}
.hero .quem{font-family:Fraunces,serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:-.01em}
.ordem{display:flex;align-items:center;gap:6px;margin-top:2px}
.ordem i{width:14px;height:14px;border-radius:5px;background:var(--c2);box-shadow:0 0 0 2px rgba(11,13,18,.85)}
.ordem i.on{width:30px}
.go{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--obsidian-950);
  box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 0 0 2px rgba(224,169,59,.55)}
.go svg{width:28px;height:28px;fill:none;stroke:var(--brass-400);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.dice{display:flex;align-items:center;gap:12px}
.dice svg{fill:rgba(243,239,227,.10);stroke:var(--ivory);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.dice .f{fill:var(--ivory);stroke:none}
.dice text{font-family:Fraunces,serif;font-weight:800;font-size:8.5px;fill:var(--ivory);stroke:none;text-anchor:middle}

.noite{--c:#2B3274}
.noite .stars{position:absolute;inset:0}
.noite .sun{position:absolute!important;right:13px;bottom:11px;width:22px;height:22px;opacity:.4;stroke-width:2}
.noite .moon{width:50px;height:50px;stroke:none;filter:drop-shadow(0 0 10px rgba(243,239,227,.45))}
.estado{font-family:Fraunces,serif;font-weight:700;font-size:21px;letter-spacing:0;line-height:1}
.caos{display:flex;align-items:center;gap:4px}
.caos svg{width:30px;height:30px;fill:none;stroke:var(--ivory);stroke-width:2.2;stroke-linecap:round}

.livre{background:linear-gradient(158deg,#2b2114,#1a1610);
  box-shadow:inset 0 0 0 1.5px rgba(224,169,59,.0),0 10px 22px rgba(0,0,0,.5),0 0 0 3px rgba(11,13,18,.85)}
.livre::before{background:none;border:2px dashed rgba(224,169,59,.55);border-radius:22px}
.livre .ic{stroke:var(--brass-400)}.livre .lb{color:#EBCB8B}.livre .sub{color:var(--mist)}

.seats{display:grid;gap:3px;width:104px;height:50px;padding:3px;border-radius:10px;background:rgba(11,13,18,.7)}
.seats .ln{display:flex;gap:3px;min-height:0}
.seats b{flex:1;border-radius:5px;background:var(--c2)}
.seats .ln.up b{border-radius:6px 6px 3px 3px}.seats .ln.dn b{border-radius:3px 3px 6px 6px}
.big{position:absolute!important;right:16px;top:50%;transform:translateY(-54%);font-size:76px}

/* ---------- hub ---------- */
.hub{position:absolute;left:437px;top:201px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:var(--obsidian-950);display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--brass-400) inset,0 0 0 7px var(--obsidian-950),0 0 0 8.5px rgba(224,169,59,.28),0 10px 26px rgba(0,0,0,.7)}
.hub svg{width:26px;height:26px;stroke:var(--ivory);stroke-width:2.6;stroke-linecap:round;fill:none}

/* ---------- jogadores ---------- */
#v-jogadores{flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;height:128px}
.p{flex:1 1 0;border-radius:22px;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;
  background:linear-gradient(160deg,rgba(41,48,65,.82),rgba(21,24,33,.92));
  box-shadow:inset 0 0 0 1.5px rgba(243,239,227,.09),inset 0 1.5px 0 rgba(255,255,255,.10),0 8px 18px rgba(0,0,0,.45)}
.p .seats{width:100%;height:64px;background:rgba(11,13,18,.8);border-radius:12px;padding:4px;gap:4px}
.p .seats .ln{gap:4px}
.p .seats b{filter:none}
.p .foot{display:flex;align-items:flex-end;justify-content:space-between}
.p .num{font-size:40px;color:var(--mist);text-shadow:none}
.p .foot span{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist-dim);padding-bottom:1px}
.p.on{background:linear-gradient(158deg,#F4CB6C 0%,var(--brass-400) 42%,var(--brass-500) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 0 0 3px var(--obsidian-950),0 0 0 5px rgba(224,169,59,.55),0 12px 30px rgba(224,169,59,.28)}
.p.on .seats{background:var(--obsidian-950)}.p.on .seats b{filter:none}
.p.on .num{color:var(--obsidian-950);font-size:46px}.p.on .foot span{color:rgba(11,13,18,.75)}
.band{height:84px;display:flex;align-items:center;justify-content:space-between}
.band .l,.band .r{width:325px;display:flex;align-items:center}
.band h1{font-family:Fraunces,serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-.015em;font-variation-settings:"opsz" 144}
.band h1 em{font-style:normal;color:var(--brass-400)}
.band .cap{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:7px}
.band .r{justify-content:flex-end;gap:8px}
.vcap{display:flex;flex-direction:column;align-items:center;gap:3px;margin-right:4px}
.vcap svg{width:24px;height:24px;fill:var(--brasa);stroke:none}
.vcap span{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);text-align:center;line-height:1.15}
.v{width:82px;height:68px;border-radius:22px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px rgba(243,239,227,.13);background:rgba(29,34,44,.78)}
.v .num{font-size:44px;color:var(--mist);text-shadow:none;transform:translateY(-2px)}
.v.on{background:linear-gradient(158deg,color-mix(in srgb,var(--brasa) 78%,#fff),var(--brasa) 45%,color-mix(in srgb,var(--brasa) 72%,#000));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 0 0 3px var(--obsidian-950),0 0 0 5px var(--ivory),0 10px 24px rgba(181,64,43,.4)}
.v.on .num{color:var(--ivory);font-size:50px;text-shadow:0 3px 8px rgba(0,0,0,.35)}
</style>
</head>
<body data-state="menu">
<div class="stage">
  <div class="mesa"></div><div class="veil"></div>

  <!-- ===================== MENU ===================== -->
  <section class="view" id="v-menu">
    <div class="row r1">
      <div class="t mare f1">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><path d="M8.5 5 3.5 10l5 5"/><path d="M3.5 10H14a5.5 5.5 0 0 1 0 11h-3.5"/></svg></div>
        <div class="lb">Desfazer</div>
      </div>
      <div class="t ameixa f2">
        <div class="dice">
          <svg width="52" height="52" viewBox="0 0 24 24"><path d="M12 2.2 20.5 7.1v9.8L12 21.8 3.5 16.9V7.1z"/><path d="M12 7.2 16.6 15.2H7.4z"/><path d="M12 2.2v5M3.5 7.1l3.9 8.1M20.5 7.1l-3.9 8.1M12 21.8l-4.6-6.6M12 21.8l4.6-6.6M3.5 7.1 12 7.2l8.5-.1"/></svg>
          <svg width="42" height="42" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle class="f" cx="8" cy="8" r="1.5"/><circle class="f" cx="16" cy="8" r="1.5"/><circle class="f" cx="12" cy="12" r="1.5"/><circle class="f" cx="8" cy="16" r="1.5"/><circle class="f" cx="16" cy="16" r="1.5"/></svg>
          <svg width="42" height="42" viewBox="0 0 24 24"><path d="M12 3.2 21.3 19.6H2.7z"/><text x="12" y="16.6">4</text></svg>
          <svg width="40" height="40" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="6" stroke-dasharray="1.2 2.4"/><path d="M12 9.2v5.6M9.8 10.6 12 9.2"/></svg>
        </div>
        <div class="lb">Dados</div>
      </div>
      <div class="t ameixa f1">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" stroke-dasharray="3.2 3.1"/><g transform="rotate(38 12 12)"><path class="f" d="M12 4.8 14.7 12H9.3z"/><path d="M9.3 12 12 19.2 14.7 12z"/></g></svg></div>
        <div class="lb">Quem<br>começa</div>
      </div>
      <div class="t ambar f1" style="--c:#A66E1B">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M3.2 8.2 7.6 12.3 12 5.2l4.4 7.1 4.4-4.1-1.7 9.3H4.9z"/><path d="M5.4 20.6h13.2"/></svg>
          <span class="pill" style="--c2:var(--ambar)"><i class="dot"></i>Bia</span></div>
        <div class="lb">Coroa</div>
      </div>
      <div class="t livre f1">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3v18.2"/><path d="M6 4.4h13l-3.3 4.3L19 13H6"/></svg></div>
        <div><div class="sub" style="margin-bottom:3px">sem dono</div><div class="lb">Iniciativa</div></div>
      </div>
    </div>

    <div class="row r2">
      <div class="t hero">
        <div class="turno"><span class="sub">Turno</span><span class="num">3</span></div>
        <div class="mid">
          <div class="lb">Passar a vez</div>
          <div class="quem">Léo</div>
          <div class="ordem"><i style="--c2:var(--brasa)"></i><i style="--c2:var(--ambar)"></i><i class="on" style="--c2:var(--musgo)"></i><i style="--c2:var(--mare)"></i></div>
        </div>
        <div class="go"><svg viewBox="0 0 24 24"><path d="M4.5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
      <div class="gap"></div>
      <div class="t indigo noite half">
        <svg class="stars" viewBox="0 0 164 120" fill="#F3EFE3"><circle cx="78" cy="80" r="1.4"/><circle cx="104" cy="96" r="1"/><circle cx="120" cy="66" r="1.5"/><circle cx="70" cy="62" r="1"/><circle cx="140" cy="88" r="1"/><path d="M100 66l1.6 4.4L106 72l-4.4 1.6L100 78l-1.6-4.4L94 72l4.4-1.6z" opacity=".9"/></svg>
        <div class="top">
          <svg class="ic moon" viewBox="0 0 24 24"><path class="f" d="M20.4 14.6A8.8 8.8 0 1 1 9.4 3.6a7 7 0 0 0 11 11z"/></svg>
          <span class="estado" style="flex:1;align-self:center;font-size:24px;padding-left:4px">noite</span>
        </div>
        <div class="lb"><span class="off">Dia /</span> Noite</div>
          <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
      </div>
      <div class="t indigo half" style="margin-left:8px">
        <div class="top">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 3 20.5 7.6 12 12.2 3.5 7.6z" fill="rgba(243,239,227,.22)"/><path d="M3.5 12.1 12 16.7l8.5-4.6"/><path d="M3.5 16.5 12 21l8.5-4.5"/></svg>
          <div class="caos"><svg viewBox="0 0 24 24"><g id="arm"><path d="M12 12c.2-4.2 3-6.8 7-6.2"/></g><use href="#arm" transform="rotate(120 12 12)"/><use href="#arm" transform="rotate(240 12 12)"/><circle cx="12" cy="12" r="1.3" fill="#F3EFE3" stroke="none"/></svg><span class="num" style="font-size:50px">2</span></div>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between"><div class="lb">Plano</div><div class="estado">caos</div></div>
      </div>
    </div>

    <div class="row r3">
      <div class="t musgo f2">
        <div class="seats" style="grid-template-rows:1fr 1fr">
          <div class="ln up"><b style="--c2:var(--mare)"></b><b style="--c2:var(--musgo);box-shadow:inset 0 0 0 1px rgba(243,239,227,.5)"></b></div>
          <div class="ln dn"><b style="--c2:var(--brasa)"></b><b style="--c2:var(--ambar)"></b></div>
        </div>
        <div class="lb">Jogadores</div>
        <span class="num big">4</span>
      </div>
      <div class="t musgo f2" style="--c:#2F6B57">
        <div class="top"><svg class="ic" viewBox="0 0 24 24" style="width:38px;height:38px"><path class="f" d="M12 20.5S4 15.6 4 9.8A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8 2.5c0 5.8-8 10.7-8 10.7z" stroke="none"/></svg></div>
        <div class="lb">Vida inicial</div>
        <span class="num big">40</span>
      </div>
      <div class="t mare f1">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="12.5" rx="2.8" fill="rgba(243,239,227,.22)"/><path d="M7.5 4.6h10.2a2.8 2.8 0 0 1 2.8 2.8v9.4"/><path d="M8 12.6h5M8 16h3"/></svg>
          <span class="num" style="font-size:40px">3</span></div>
        <div class="lb">Partidas<br>guardadas</div>
      </div>
      <div class="t brasa f1">
        <div class="top"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3v18.2"/><path d="M6 4.4h13v8.8H6" fill="rgba(243,239,227,.18)"/><path class="f" stroke="none" d="M6 4.4h4.3v4.4H6zM14.6 4.4H19v4.4h-4.4zM10.3 8.8h4.3v4.4h-4.3z"/></svg></div>
        <div class="lb">Encerrar<br>partida</div>
      </div>
    </div>
  </section>

  <!-- ===================== JOGADORES ===================== -->
  <section class="view" id="v-jogadores">
    <div class="prow" id="pa"></div>
    <div class="band">
      <div class="l"><div><div class="cap">Mesa para</div><h1><em>4</em> jogadores</h1></div></div>
      <div class="r">
        <div class="vcap"><svg viewBox="0 0 24 24"><path d="M12 20.5S4 15.6 4 9.8A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8 2.5c0 5.8-8 10.7-8 10.7z"/></svg><span>Vida<br>inicial</span></div>
        <div class="v"><span class="num">20</span></div>
        <div class="v"><span class="num">30</span></div>
        <div class="v on"><span class="num">40</span></div>
      </div>
    </div>
    <div class="prow" id="pb"></div>
  </section>

  <div class="hub" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
</div>
<script>
const st=(location.hash||'#menu').slice(1); document.body.dataset.state=(st==='jogadores')?'jogadores':'menu';
const cores=['--brasa','--ambar','--musgo','--mare','--indigo','--ameixa'];
function mini(n){
  const dn=Math.ceil(n/2), up=n-dn; let k=0;
  const ln=(q,cls)=>'<div class="ln '+cls+'">'+Array.from({length:q},()=>'<b style="--c2:var('+cores[(k++)%6]+')"></b>').join('')+'</div>';
  const baixo=ln(dn,'dn'); const cima=up?ln(up,'up'):'';
  return '<div class="seats" style="grid-template-rows:'+(up?'1fr 1fr':'1fr')+'">'+cima+baixo+'</div>';
}
for(let n=1;n<=10;n++){
  const el=document.createElement('div'); el.className='p'+(n===4?' on':'');
  el.innerHTML=mini(n)+'<div class="foot"><b class="num">'+n+'</b>'+(n===4?'<span>atual</span>':'')+'</div>';
  document.getElementById(n<=5?'pa':'pb').appendChild(el);
}
</script>
</body>
</html>
