<title>Mesa BrewTact</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* One visual world on purpose: a game table is a dark surface in any host theme. */
  :root {
    --obsidian-950: #0B0D12;
    --obsidian-900: #151821;
    --slate-850: #1D222C;
    --slate-750: #293041;
    --ivory: #F3EFE3;
    --mist: #B8C0CC;
    --mist-dim: #8A93A3;
    --brass-400: #E0A93B;
    --brass-500: #C58B2A;
    --brass-700: #8E641B;
    --danger: #FF8A80;
    --frost-400: #6FA8DC;            /* azul frio: o aro do hub quando a mesa está de noite */
    --vinho: #6E1B2A;                /* estado ruim valendo; nenhum jogador tem esta cor */
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --gap: 6px;
    /* Screen safe area. Left/right come from the browser; a native host may push all four
       through window.__setInsets (top/bottom stay 0 here because the page frame already pads them). */
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
    --st: 0px;
    --sb: 0px;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--obsidian-950);
    color: var(--ivory);
    font: 500 14px/1.4 var(--ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--brass-400); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px 12px; gap: 10px; box-sizing: border-box; }

  /* ── header (tablet / desktop only) ───────────────────── */
  .top { display: flex; align-items: center; gap: 10px; min-height: 34px; }
  .top svg.mark { width: 26px; height: 26px; flex: none; }
  .top h1 { margin: 0; font: 600 17px/1 var(--display); letter-spacing: .01em; white-space: nowrap; }
  .top h1 small { font: 500 12px/1 var(--ui); color: var(--mist); margin-left: 8px; letter-spacing: 0; }
  .tag { font: 600 10px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--brass-400); border: 1px solid var(--brass-700); border-radius: 999px; padding: 4px 8px; }
  .clock { margin-left: auto; font: 600 13px/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--mist); display: flex; align-items: center; gap: 6px; }
  .clock::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brass-400); }

  /* ── stage & table ────────────────────────────────────── */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 22px; container-type: size; }
  /* .rot carries the table-relative safe area: which screen edge each table edge touches.
     It is also the box the sheets live in, so its own height is what they have to fit into —
     on a phone held upright that is the screen's short side, not its long one. */
  .rot { position: absolute; inset: 0; container-type: size; --tl: var(--sl); --tr: var(--sr); --tt: var(--st); --tb: var(--sb); }
  .table { position: relative; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); }
  .table.solo { grid-template-rows: minmax(0, 1fr); }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--gap); min-height: 0; }

  .panel {
    --il: 0px; --ir: 0px; --ib: 0px;   /* safe-area insets in the panel's own orientation */
    --hl: 0px; --hr: 0px;               /* clearance for the hub when it sits on this panel's corner */
    position: relative; min-width: 0; min-height: 0; border-radius: 18px; overflow: hidden;
    container-type: size;
    --wash: transparent;
    background:
      linear-gradient(var(--wash), var(--wash)),
      radial-gradient(120% 90% at 82% 0%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(110% 100% at 0% 100%, rgba(0,0,0,.34), transparent 62%),
      var(--bg, #3B4699);
    transition: background-color .3s;
    box-shadow: inset 0 0 0 1px rgba(243,239,227,.10);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  .row-bottom .panel { --ib: var(--tb); }
  .row-bottom .panel:first-child { --il: var(--tl); }
  .row-bottom .panel:last-child { --ir: var(--tr); }
  .row-top .panel { --ib: var(--tt); }               /* upside down: its bottom is the table's top… */
  .row-top .panel:first-child { --ir: var(--tl); }   /* …and its right is the table's left */
  .row-top .panel:last-child { --il: var(--tr); }
  .panel-in { position: absolute; inset: 0; }
  .row-top .panel-in { transform: rotate(180deg); }

  /* the whole half is the tap area; the marks sit at the far ends, away from the numeral */
  .half { position: absolute; top: 0; bottom: 0; width: 50%; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .half.minus { left: 0; width: 50%; --dir: right; }
  .half.plus { right: 0; width: 50%; --dir: left; }
  .half span { position: absolute; top: 50%; translate: 0 -50%; font: 400 min(26cqh, 9cqw)/1 var(--display); opacity: .62; transition: opacity .12s, scale .12s; }
  .half.minus span { left: calc(14px + var(--il)); }
  .half.plus span { right: calc(14px + var(--ir)); }
  .half.is-down span { opacity: 1; scale: 1.25; }
  .half.is-down { background: linear-gradient(to var(--dir), rgba(255,255,255,.10), transparent 72%); }
  .half:focus-visible { outline-offset: -4px; border-radius: 18px; }

  /* life: the numeral owns the panel, and is itself the button that opens the keypad */
  /* The numeral is centred on the card itself: equal room above and below, none of the screen's
     safe-area asymmetry, so every player reads the same number in the same place on their own card. */
  .core { --corev: 38px; position: absolute; inset: var(--corev) 0; display: grid; place-items: center; pointer-events: none; }
  .setlife { position: relative; pointer-events: auto; display: grid; place-items: center; width: max(40px, min(22cqw, 112px)); height: 100%; min-height: 44px; border-radius: 16px; }
  .setlife:disabled { pointer-events: none; }
  .setlife .life { position: absolute; white-space: nowrap; }
  .life {
    display: block; font: 600 min(calc((100cqh - 2 * var(--corev)) * 1.38), 38cqw)/.72 var(--display); font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: -.03em; text-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .life.is-wide { font-size: min(calc((100cqh - 2 * var(--corev)) * 1.38), 26cqw); }
  .panel.is-mode .core, .panel.is-out .core { display: none; }
  /* while this panel is a damage input, the note under it gets its room back — still centred, just smaller */
  .panel.is-source .core { --corev: calc(44px + var(--ib)); }
  /* two commanders: the damage-input card splits into two lanes, each with its own numeral,
     its own ± and its own 21. The names sit on the outer edge of each lane, never beside the numeral. */
  .panel.is-duo .half:not(.lane-b) { top: 0; bottom: 50%; }
  .panel.is-duo .half.lane-b { top: 50%; bottom: 0; }
  .panel.is-duo .half.lane-b.minus { left: 0; right: 50%; }
  .panel.is-duo .half.lane-b.plus { left: 50%; right: 0; }
  .panel.is-duo .core { --corev: 22px; inset: 22px 0 calc(50% + 4px); }
  .panel.is-duo .core-b { --corev: 22px; inset: calc(50% + 4px) 0 22px; display: grid; place-items: center; pointer-events: none; }
  .panel.is-duo .life { font: 600 min(calc((50cqh - 52px) * 1.38), 30cqw)/.72 var(--display);
    font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.03em; }
  /* com duas faixas o nome sai: a cor já diz de quem é o card, e cada faixa precisa da linha inteira */
  .panel.is-duo .strip { display: none; }
  .panel.is-duo .panel-in::after { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 1px; background: rgba(243,239,227,.22); }
  .lanenote { position: absolute; left: calc(10px + var(--il) + var(--hl)); max-width: calc(50% - 40px); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 10px/1.2 var(--ui); letter-spacing: .06em;
    text-transform: uppercase; color: var(--brass-400); pointer-events: none; }
  .lanenote.a { top: 5px; }
  .lanenote.b { bottom: calc(5px + var(--ib)); }
  .panel.is-duo .delta { display: none; }

  /* life as a thin bar on the far edge, so the numeral keeps the whole panel */
  .lifebar { position: absolute; top: 0; left: calc(10px + var(--il)); right: calc(10px + var(--ir)); height: 4px; border-radius: 0 0 4px 4px; background: rgba(243,239,227,.16); overflow: hidden; }
  .lifebar i { display: block; height: 100%; width: 100%; background: var(--ivory); transform-origin: left; transition: scale .3s ease, background .3s; }
  .panel.is-low .lifebar i { background: var(--danger); }
  .panel.is-source .lifebar i { background: var(--brass-400); }

  .delta {
    position: absolute; bottom: calc(8px + var(--ib)); left: calc(50% + var(--dx, 0px)); translate: -50% 0;
    font: 700 clamp(12px, 8cqh, 20px)/1 var(--ui); font-variant-numeric: tabular-nums;
    background: rgba(11,13,18,.55); padding: .35em .7em; border-radius: 999px; opacity: 0; transition: opacity .2s;
  }
  .delta.on { opacity: 1; }

  /* a player who is out, and the mode banner, take over the whole panel — readable across the table */
  .banner { position: absolute; inset: 30px calc(8px + var(--ir) + var(--hr) * 2) calc(48px + var(--ib)) calc(8px + var(--il) + var(--hl) * 2); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2cqh; text-align: center; pointer-events: none; }
  .panel.is-out .banner, .panel.is-mode .banner { display: flex; }
  .panel.is-mode .banner { top: 56px; }
  .panel.is-out .banner { top: 52px; }     /* a faixa do eliminado começa abaixo do ⋯, nunca por baixo dele */
  .panel.is-mode .outlabel { font-size: min(17cqh, 6.5cqw); }
  .outlabel { font: 700 min(26cqh, 11cqw)/.95 var(--ui); letter-spacing: .02em; text-transform: uppercase; }
  .panel.is-out .outlabel { color: #F0B6E8; }
  .panel.is-mode .outlabel { color: var(--ivory); }
  /* a frase que o jogador escreveu ocupa mais letras que "Eliminado": desce um degrau, com piso legível */
  .outlabel.msg { font-size: clamp(15px, min(18cqh, 7.5cqw), 40px); text-transform: none; letter-spacing: 0;
    overflow-wrap: anywhere; }   /* uma palavra de 28 letras também tem de caber no card */
  .outlabel.msg.is-long { font-size: clamp(14px, min(12cqh, 4.8cqw), 26px); }
  .outwhy { font: 600 clamp(10px, 7cqh, 15px)/1.2 var(--ui); color: rgba(243,239,227,.78); text-transform: uppercase; letter-spacing: .08em; }
  .panel.is-out { background: linear-gradient(rgba(11,13,18,.72), rgba(11,13,18,.72)), var(--bg); }
  .panel.is-out .half, .panel.is-out .lifebar, .panel.is-out .chips { display: none; }
  .panel.is-mode .strip, .panel.is-counters .strip { display: none; }
  .revive { position: absolute; inset: 0; pointer-events: none; }
  .panel.is-out .revive { pointer-events: auto; }

  .strip { position: absolute; top: 8px; left: calc(12px + var(--il) + var(--hl)); right: calc(52px + var(--ir) + var(--hr)); display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
  .who { flex: 0 0 auto; min-width: 0; max-width: 55%; display: grid; gap: 1px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .who .name { font: 700 12px/1.15 var(--ui); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .who .name b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .cmdr { display: none; font: 500 10px/1.2 var(--ui); color: rgba(243,239,227,.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .starts { display: none; text-shadow: none; font: 700 9px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; background: var(--ivory); color: var(--obsidian-950); border-radius: 999px; padding: 3px 5px; flex: none; }
  .panel.is-starter .starts, .panel.is-turn .starts { display: inline-block; }
  .panel.is-turn .starts { background: var(--brass-400); }
  .panel.is-won .starts { background: var(--ivory); color: var(--obsidian-950); }
  /* whose turn it is — a ring on the card itself, so it costs no room and hides nothing */
  /* o banho vale para todo card, inclusive o eliminado e o que virou entrada de dano:
     senão a mesa perderia o indicador justamente no modo em que ele importa */
  .table.is-day .panel { --wash: rgba(255, 214, 140, .14); }
  .table.is-night .panel { --wash: rgba(26, 46, 96, .30); }
  .panel.is-turn { box-shadow: inset 0 0 0 4px var(--brass-400), inset 0 0 0 7px rgba(11,13,18,.55); }
  .panel.is-turn.is-paused { box-shadow: inset 0 0 0 4px rgba(224,169,59,.45), inset 0 0 0 7px rgba(11,13,18,.4); }
  .panel.is-pick { box-shadow: inset 0 0 0 3px var(--ivory); }

  /* coroa e iniciativa: peças de verdade, apoiadas na borda de quem segura e arrastáveis para outro card */
  .tok { position: absolute; bottom: calc(6px + var(--ib)); width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--obsidian-950); color: var(--brass-400);
    box-shadow: inset 0 0 0 1.5px var(--brass-500), 0 4px 12px rgba(0,0,0,.45); touch-action: none; z-index: 3; }
  /* as peças ficam empilhadas no canto do card, dentro da área segura e longe do numeral */
  .tok[data-tok="crown"] { right: calc(6px + var(--ir)); }
  .tok[data-tok="init"] { right: calc(6px + var(--ir)); bottom: calc(56px + var(--ib)); }
  .tok svg { width: 22px; height: 22px; }
  .tok.is-carrying { z-index: 6; scale: 1.12; box-shadow: inset 0 0 0 2px var(--brass-400), 0 10px 24px rgba(0,0,0,.6); }
  .panel.is-drop { box-shadow: inset 0 0 0 3px var(--brass-400); }
  /* durante o dano de comandante o card é outra coisa; as peças voltam quando a mesa volta ao jogo
     (nesse intervalo, quem passa a coroa usa Mesa › Coroa e iniciativa) */
  .panel.is-source .tok, .panel.is-out .tok, .panel.is-mode .tok { display: none; }
  .more { position: absolute; top: 4px; right: calc(4px + var(--ir) + var(--hr)); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .more::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: rgba(11,13,18,.26); }
  .more:hover::before { background: rgba(11,13,18,.45); }
  .more svg { position: relative; width: 18px; height: 18px; }

  .chips { flex: 0 1 auto; min-width: 0; margin-left: auto; display: flex; flex-wrap: nowrap; overflow: hidden; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font: 700 11px/1 var(--ui); font-variant-numeric: tabular-nums; background: rgba(11,13,18,.55); border-radius: 999px; padding: 4px 7px 4px 5px; }
  .chip svg { width: 12px; height: 12px; }
  .chip.is-lethal { background: var(--ivory); color: var(--obsidian-950); }

  /* three faces per card — drag sideways to turn them. The card stays as quiet as a real life pad:
     these dots only say where you are, and the way back is a real button on each face. */
  .dots { position: absolute; bottom: calc(7px + var(--ib)); left: calc(50% + var(--dx, 0px)); translate: -50% 0; display: flex; gap: 4px; pointer-events: none; transition: opacity .16s; }
  .dots i { width: 5px; height: 5px; border-radius: 999px; background: rgba(243,239,227,.34); transition: width .18s, background .18s; }
  .dots i.on { width: 16px; background: rgba(243,239,227,.92); }
  .panel.is-delta .dots, .panel.is-out .dots, .panel.is-source .dots { opacity: 0; transition: none; }

  /* counters page, on the player's own panel */
  .counters { position: absolute; inset: calc(12px + var(--ctop, 0px)) calc(8px + var(--ir) + var(--hr)) calc(52px + var(--ib)) calc(8px + var(--il) + var(--hl)); display: none; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 0 6px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
  .panel.is-counters .counters { display: flex; }
  /* while a finger drags sideways, the live page leans the same way, so the gesture is visible before it commits */
  .panel.is-dragging .core, .panel.is-dragging .counters, .panel.is-dragging .banner, .panel.is-dragging .strip {
    transform: translateX(var(--drag, 0px)); opacity: calc(1 - .5 * var(--dragf, 0)); }
  .panel.is-counters .core, .panel.is-counters .half, .panel.is-counters .lifebar { display: none; }
  .crow { display: flex; align-items: center; gap: 2px; justify-content: center; min-height: 40px; flex: 0 0 auto; }
  .crow .pm { width: 40px; height: 40px; border-radius: 50%; font: 500 17px/1 var(--ui); flex: none; position: relative; isolation: isolate; }
  .crow .pm::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: rgba(11,13,18,.4); z-index: -1; }
  .crow .pm:hover::before { background: rgba(11,13,18,.6); }
  .crow .pm:disabled { opacity: .35; }
  .crow .mid { display: grid; justify-items: center; gap: 0; min-width: 34px; }
  .crow .ico { width: 15px; height: 15px; opacity: .95; }
  .crow output { text-align: center; font: 600 17px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
  .crow output.is-lethal { background: var(--ivory); color: var(--obsidian-950); border-radius: 6px; padding: 1px 4px; }
  .cback { min-width: 96px; height: 40px; border-radius: 999px; display: grid; grid-auto-flow: column; align-items: center; gap: 5px; padding: 0 12px; background: rgba(243,239,227,.92); color: var(--obsidian-950); font: 700 11px/1 var(--ui); text-transform: uppercase; letter-spacing: .04em; }
  .cback svg { width: 14px; height: 14px; }
  .cadd { min-width: 112px; height: 40px; border-radius: 999px; display: grid; grid-auto-flow: column; align-items: center; gap: 4px; padding: 0 10px; background: rgba(11,13,18,.4); font: 700 11px/1 var(--ui); text-transform: uppercase; letter-spacing: .04em; }
  .cadd svg { width: 14px; height: 14px; }

  /* commander damage: one panel receives, every other panel is the input for its own commander */
  .panel.is-receiver { box-shadow: inset 0 0 0 3px var(--ivory); }
  .modebar { position: absolute; left: calc(8px + var(--il) + var(--hl) * 2); right: calc(8px + var(--ir)); top: 6px; display: none; justify-content: flex-start; }
  .panel.is-receiver .modebar { display: flex; }
  .modebar button { min-height: 44px; display: grid; grid-auto-flow: column; align-items: center; gap: 6px; background: var(--brass-400); color: var(--obsidian-950); border-radius: 999px; padding: 0 16px; font: 700 13px/1 var(--ui); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .modebar button svg { width: 14px; height: 14px; }
  .panel.is-source { background: linear-gradient(rgba(11,13,18,.32), rgba(11,13,18,.32)), var(--bg); }
  .panel.is-source .chips, .panel.is-source .more, .panel.is-source .starts { display: none; }
  .panel.is-mode .more, .panel.is-mode .delta, .panel.is-source .delta { display: none; }
  .srcnote { position: absolute; bottom: calc(10px + var(--ib)); left: calc(10px + var(--il)); right: calc(10px + var(--ir)); display: none; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 11px/1.2 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--brass-400); }
  .panel.is-source .srcnote { display: block; }
  .panel.is-duo .srcnote { display: none; }      /* cada faixa já diz de quem é o comandante */

  /* ── hub: one button on the seam; it opens into the action rail ── */
  .hubwrap { position: absolute; top: 50%; left: 50%; translate: -50% -50%; z-index: 3; }
  .table.solo .hubwrap { top: auto; bottom: calc(10px + var(--tb)); translate: -50% 0; }
  .rail { position: relative; display: flex; align-items: center; }
  .rail .hub { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--obsidian-900); box-shadow: inset 0 0 0 1.5px var(--brass-500), 0 0 0 4px var(--obsidian-950); }
  .rail .hub svg { width: 26px; height: 26px; }
  .rail .hub .swords, .rail .hub .sun, .rail .hub .moon, .rail .hub .planar { display: none; }
  /* precedência escrita: dano de comandante > dia/noite > marca da mesa */
  .hubwrap.dn-day .rail .hub .mark, .hubwrap.dn-night .rail .hub .mark { display: none; }
  .hubwrap.dn-day .rail .hub .sun { display: block; }
  .hubwrap.dn-night .rail .hub .moon { display: block; }
  .hubwrap.mode .rail .hub .sun, .hubwrap.mode .rail .hub .moon { display: none; }
  .hubwrap.mode .rail .hub { box-shadow: inset 0 0 0 2px var(--brass-400), 0 0 0 4px var(--obsidian-950); }
  .hubwrap.mode .rail .hub .mark { display: none; }
  .hubwrap.mode .rail .hub .swords { display: block; }
  .hubwrap.dn-night .rail .hub { box-shadow: inset 0 0 0 1.5px var(--frost-400), 0 0 0 4px var(--obsidian-950); }
  .hubwrap.mode .rail .hub, .hubwrap.open.mode .rail .hub { box-shadow: inset 0 0 0 2px var(--brass-400), 0 0 0 4px var(--obsidian-950); }
  /* precedência escrita, e nesta ordem: dano de comandante > plano > dia/noite > marca da mesa.
     Dia e noite não some da mesa quando o plano assume o hub: ele continua no banho de luz dos cards. */
  .hubwrap.planar .rail .hub .mark, .hubwrap.planar .rail .hub .sun, .hubwrap.planar .rail .hub .moon { display: none; }
  .hubwrap.planar .rail .hub .planar { display: block; }
  .hubwrap.mode .rail .hub .planar, .hubwrap.mode.planar .rail .hub .planar { display: none; }

  /* ═══ Menu da mesa: peças de vitral sobre a mesa viva ═══════════════════════════════
     Gramática: vidro escuro = ação neutra · cor cheia = algo está VALENDO · latão = a jogada
     principal e tudo que está selecionado · tracejado = vazio, sem dono · brasa = encerra. */
  .menu { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: max(8px, var(--tt)) max(8px, var(--tr)) max(8px, var(--tb)) max(8px, var(--tl)); box-sizing: border-box;

    background: linear-gradient(160deg, rgba(41,48,65,.88), rgba(21,24,33,.95));

  .menu .t:disabled { opacity: .38; }
  .menu .t > * { position: relative; }
  .menu .t .ic { width: 34px; height: 34px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .menu .t .ic .f { fill: currentColor; stroke: none; }
  .menu .lb { font: 800 11.5px/1.18 var(--ui); letter-spacing: .085em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.35); }

  .menu .state .dotp { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 0 1.5px rgba(243,239,227,.85); }
  /* cor cheia: só para o que está valendo */
  .menu .t.lit { background: linear-gradient(158deg, color-mix(in srgb, var(--c) 90%, #fff) 0%, var(--c) 42%, var(--c2, color-mix(in srgb, var(--c) 66%, #000)) 100%);
    box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.17), inset 0 1.5px 0 rgba(255,255,255,.30), inset 0 -10px 22px rgba(0,0,0,.16), 0 10px 22px rgba(0,0,0,.5), 0 0 0 3px rgba(11,13,18,.85); }
  .menu .t.lit::before, .menu .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.13) 0 34%, transparent 34.2%), linear-gradient(200deg, transparent 0 72%, rgba(0,0,0,.10) 72.2%); }
  .menu .t.livre { background: linear-gradient(158deg, #2b2114, #1a1610); box-shadow: 0 8px 18px rgba(0,0,0,.45); }
  .menu .t.livre::before { content: ""; position: absolute; inset: 0; border: 2px dashed rgba(224,169,59,.5); border-radius: 22px; pointer-events: none; }
  .menu .t.livre .ic { color: var(--brass-400); } .menu .t.livre .lb { color: #EBCB8B; } .menu .t.livre .state { font: 700 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--mist); }
  .menu .t.danger { --c: var(--vinho); }

  /* a jogada principal: passar a vez */
  .menu .hero { flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; padding: 10px 14px 10px 16px; color: var(--obsidian-950);
    background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 40%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 10px 22px rgba(0,0,0,.5), 0 0 0 3px rgba(11,13,18,.85); }

  .menu .hero .sub { color: rgba(11,13,18,.7); }
  .menu .hero .num { font-size: 70px; text-shadow: 0 1px 0 rgba(255,255,255,.35); }

  .menu .go { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--obsidian-950);
    box-shadow: 0 6px 14px rgba(0,0,0,.4), inset 0 0 0 2px rgba(224,169,59,.55); }

  /* dia e noite: a peça É o céu */

    radial-gradient(1.4px 1.4px at 58% 30%, #fff 60%, transparent 62%), radial-gradient(1.2px 1.2px at 72% 58%, #fff 60%, transparent 62%),
    radial-gradient(1.6px 1.6px at 84% 24%, #fff 60%, transparent 62%), radial-gradient(1.2px 1.2px at 64% 76%, #fff 60%, transparent 62%),
    radial-gradient(1.3px 1.3px at 44% 62%, #fff 60%, transparent 62%); }

  .tok-tile.lit[data-k="init"] { --c: #2F6C8C; --c2: #12303F; }
  /* a mesa em miniatura, nas cores reais dos assentos */
  .seats { display: grid; gap: 3px; width: 104px; height: 50px; padding: 3px; border-radius: 10px; background: rgba(11,13,18,.7); box-sizing: border-box; }
  .seats .ln { display: flex; gap: 3px; min-height: 0; }

  #tileMesa .bignums { position: absolute; right: 14px; top: 10px; bottom: 10px; display: flex; align-items: center; gap: 12px; }

  /* ═══ Telas secundárias: a mesa continua embaixo, e a escolha é um objeto, não um campo ═══ */
  .seatpick { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; width: min(100%, 780px); margin-inline: auto; padding: 8px; box-sizing: border-box; }
  .prow { display: flex; gap: 10px; flex: 1 1 0; max-height: 134px; min-height: 0; }
  .p { flex: 1 1 0; min-width: 0; border-radius: 22px; padding: 11px 12px 9px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left;
    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94));
    box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), inset 0 1.5px 0 rgba(255,255,255,.10), 0 8px 18px rgba(0,0,0,.45); }
  .p .seats { width: 100%; height: auto; flex: 1 1 0; max-height: 66px; min-height: 30px; background: rgba(11,13,18,.8); border-radius: 12px; padding: 4px; gap: 4px; }
  .p .seats .ln { gap: 4px; flex: 1; }
  .p .num { font: 700 38px/.85 var(--display); font-variant-numeric: lining-nums; color: var(--mist); margin-top: 6px; }
  .p.on { background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 42%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(224,169,59,.55), 0 12px 30px rgba(224,169,59,.28); }
  .p.on .seats { background: var(--obsidian-950); } .p.on .num { color: var(--obsidian-950); font-size: 44px; }
  .p.is-armed, .v.is-armed { box-shadow: inset 0 0 0 2px var(--brass-400), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(224,169,59,.35); }
  .p.is-armed .num, .v.is-armed .num { color: var(--brass-400); }
  .band { flex: none; height: 84px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
  /* "como sentam" fica ao lado do número, na mesma banda: a escolha é a miniatura, não um rótulo */
  .band .l { min-width: 0; display: grid; grid-template-columns: minmax(0, auto) auto; align-items: center; column-gap: 10px; row-gap: 2px; }
  .band .l .cap { grid-column: 1 / -1; }
  .arow { display: flex; gap: 4px; }
  .a { width: 46px; height: 44px; flex: none; border-radius: 12px; padding: 4px; box-sizing: border-box;
    background: rgba(29,34,44,.8); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.13); }
  .a .seats { width: 100%; height: 100%; background: transparent; padding: 0; gap: 3px; border-radius: 0; }
  .a .seats .ln { gap: 3px; flex: 1; }
  .a .seats b { border-radius: 2.5px; background: var(--mist-dim); }
  .a.on { background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 42%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 0 0 2px var(--obsidian-950), 0 0 0 4px rgba(224,169,59,.5); }
  .a.on .seats b { background: var(--obsidian-950); } .band .r { display: grid; justify-items: end; min-width: 0; }
  .band .r .cap { font: 800 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); display: flex; align-items: center; gap: 5px; margin-bottom: 5px; } .band .r .cap svg { width: 13px; height: 13px; color: #D9695A; }
  .band .r .vrow { flex-wrap: nowrap; }
  .band .l .cap, .rband .cap { display: block; font: 800 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); margin-bottom: 7px; }
  /* 28px e não 36: com as miniaturas de arranjo ao lado, 36 cortava "4 joga…" */
  .band h2 { margin: 0; font: 700 26px/1.2 var(--display); letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 2px; }
  .band h2 em { font-style: normal; color: var(--brass-400); }
  .band .x { width: 64px; height: 64px; background: var(--obsidian-950);
    box-shadow: inset 0 0 0 2px var(--brass-400), 0 0 0 7px var(--obsidian-950), 0 0 0 8.5px rgba(224,169,59,.28), 0 10px 26px rgba(0,0,0,.7); }
  .band .x svg { width: 24px; height: 24px; }
  .vcap { display: grid; justify-items: center; gap: 3px; margin-right: 2px; font: 800 10.5px/1.15 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--mist); text-align: center; }
  .vcap svg { width: 22px; height: 22px; color: #D9695A; }
  .v { width: 70px; height: 58px; flex: none; border-radius: 20px; display: grid; place-items: center; background: rgba(29,34,44,.8); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.13); }
  .v .num { font: 700 36px/1 var(--display); font-variant-numeric: lining-nums; color: var(--mist); translate: 0 -2px; }
  .v.other .num { font-size: 30px; }
  .v.on { background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 42%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(224,169,59,.55); }
  .v.on .num { color: var(--obsidian-950); font-size: 40px; }
  /* regras: peças que acendem */
  .sheet-body.rules { gap: 14px; }
  .rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94)); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), 0 8px 18px rgba(0,0,0,.4); color: var(--mist); }

  .rt.on b { color: var(--obsidian-950); } .rt.on .st { color: rgba(11,13,18,.72); }

  /* dados: formas, não botões */
  .sheet-body.dx { grid-template-columns: 200px minmax(0, 1fr); grid-template-areas: 'hero dice' 'start start' 'log log'; gap: 10px; align-content: start; }

    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94)); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), 0 8px 18px rgba(0,0,0,.45); color: var(--mist); }

  .dx-die:active { scale: .95; }
  .dx-die svg { width: 40px; height: 40px; fill: rgba(243,239,227,.07); stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .dx-die svg .f { fill: currentColor; stroke: none; }
  .dx-die span { font: 800 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
  .dx-start { grid-area: start; min-height: 64px; border-radius: 20px; display: flex; align-items: center; gap: 14px; padding: 0 18px; text-align: left; color: var(--ivory);
    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94)); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), 0 6px 14px rgba(0,0,0,.4); }

  .dx-start span { display: grid; gap: 3px; } .dx-start b { font: 700 17px/1 var(--display); } .dx-start i { font: 600 11px/1 var(--ui); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
  .dx-hr { grid-area: start; display: flex; gap: 8px; min-width: 0; }
  .dx-p { --c: #3B4699; flex: 1 1 0; min-width: 0; min-height: 64px; border-radius: 18px; padding: 8px 10px; position: relative; display: grid; align-content: center; gap: 2px;
    background: linear-gradient(158deg, color-mix(in srgb, var(--c) 80%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 68%, #000) 100%); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.16), 0 6px 14px rgba(0,0,0,.4); }
  .dx-p .num { font: 700 30px/.9 var(--display); font-variant-numeric: lining-nums; }
  .dx-p b { font: 700 11px/1.1 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dx-p .tag { position: absolute; top: 7px; right: 8px; font: 800 9px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; background: var(--brass-400); color: var(--obsidian-950); border-radius: 999px; padding: 3px 6px; }
  .dx-p.win { box-shadow: 0 0 0 3px var(--obsidian-950), 0 0 0 5px var(--brass-400), 0 8px 20px rgba(224,169,59,.3); }
  .dx-again { width: 56px; flex: none; border-radius: 18px; display: grid; place-items: center; color: var(--mist); background: rgba(29,34,44,.8); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.10); }
  .dx-again svg { width: 22px; height: 22px; }
  .sheet-body.dx .log { grid-area: log; }

  /* folha do jogador: veste a cor dele */
  .sheet-body.pf { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px 14px; align-content: start; }
  .pf .cap { display: block; font: 800 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); margin-bottom: 7px; }
  .pf-wide { grid-column: 1 / -1; }
  .pf-life { border-radius: 22px; padding: 12px 14px; display: grid; gap: 8px; align-content: start;
    background: linear-gradient(158deg, color-mix(in srgb, var(--c) 92%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 66%, #000) 100%);
    box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.17), inset 0 1.5px 0 rgba(255,255,255,.28), 0 10px 22px rgba(0,0,0,.45); }
  .pf-life .cap { color: var(--ivory); text-shadow: 0 1px 3px rgba(11,13,18,.45); margin: 0; }
  .pf-left .vrow { flex-wrap: nowrap; } .pf-left .vrow .rt.sm { flex: 1 1 0; width: auto; min-width: 0; }
  .pf-left, .pf-side { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .pf-row, .pf-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pf-row2 .pf-pad { flex: 1; }
  .pf-row output { font: 700 64px/.9 var(--display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.03em; text-shadow: 0 3px 8px rgba(0,0,0,.3); min-width: 0; }
  .pf-st { width: 48px; height: 48px; flex: none; border-radius: 50%; font: 600 22px/1 var(--ui); background: rgba(11,13,18,.34); }
  .pf-st.sm { font: 800 13px/1 var(--ui); }
  .pf-pad { min-height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(11,13,18,.34); font: 700 12px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; }
  .pf-pad svg { width: 16px; height: 16px; }
  .pf-states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pf-states .rt { min-height: 74px; padding: 9px 10px; gap: 3px; border-radius: 18px; }
  .pf-states .rt .st { white-space: nowrap; }
  .pf-states .rt b { font-size: 13px; } .pf-states .rt .ico, .pf-states .rt .ico svg { width: 20px; height: 20px; }
  .rt.bad.on { background: linear-gradient(158deg, color-mix(in srgb, var(--vinho) 82%, #fff), var(--vinho) 45%, color-mix(in srgb, var(--vinho) 70%, #000)); color: var(--ivory);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.26), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(158,52,74,.5); }
  .rt.bad.on b { color: var(--ivory); } .rt.bad.on .st { color: var(--ivory); text-shadow: 0 1px 3px rgba(11,13,18,.45); }
  .pf .swatches button { width: 44px; height: 44px; }
  /* o que se digita é uma placa: serifa grande sobre um fio, sem caixa de formulário */
  .plaque { display: block; min-width: 0; }
  .plaque input { width: 100%; box-sizing: border-box; background: none; border: 0; border-bottom: 2px solid rgba(243,239,227,.45); border-radius: 0; color: var(--ivory);
    font: 600 22px/1.2 var(--display); padding: 2px 0 7px; }
  .plaque input::placeholder { color: var(--mist-dim); font-style: italic; }
  .plaque input:focus { outline: none; border-bottom-color: var(--brass-400); }

  /* plano: o dado planar é o herói */
  .sheet-body.pl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; align-content: start; }
  .pl .cap { display: block; font: 800 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); margin-bottom: 6px; }
  .pl-wide { grid-column: 1 / -1; }
  .pl-modes { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pl-hero { grid-column: 1 / -1; min-height: 92px; border-radius: 22px; display: flex; align-items: center; gap: 16px; padding: 12px 18px; text-align: left; color: var(--mist);
    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94)); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), 0 8px 18px rgba(0,0,0,.45); }
  .pl-hero .face { width: 56px; height: 56px; flex: none; display: grid; place-items: center; }
  .pl-hero .face svg { width: 48px; height: 48px; }
  .pl-hero .txt { display: grid; gap: 4px; min-width: 0; }
  .pl-hero b { font: 700 30px/1 var(--display); color: var(--ivory); }
  .pl-hero i { font: 800 11px/1 var(--ui); font-style: normal; letter-spacing: .1em; text-transform: uppercase; }
  .pl-hero.has { color: var(--obsidian-950); background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 42%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(224,169,59,.45), 0 12px 30px rgba(224,169,59,.22); }
  .pl-hero.has b { color: var(--obsidian-950); }
  .pl-grid { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: end; }
  .pl-count .pl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 18px; padding: 6px 8px; background: rgba(29,34,44,.72); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09); }
  .pl-count output { font: 700 34px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; color: var(--ivory); }
  .pl-count .sub { display: block; margin-top: 5px; font: 700 10.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--mist-dim); }
  .pl-arch { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 2fr); gap: 12px; align-items: end; }
  .pl-who { display: flex; gap: 8px; min-width: 0; }
  .pl-who .dx-p { min-height: 56px; align-content: end; }
  .pl-who .dx-p.off { background: rgba(29,34,44,.72); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09); color: var(--mist); }
  .pl-who .dx-p.off b { color: var(--mist); }

  /* turnos: o tempo de cada um é uma barra na cor dele */
  .sheet-body.tn { gap: 14px; align-content: start; }
  .tn .cap { display: flex; align-items: baseline; gap: 6px; font: 800 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); margin-bottom: 8px; }
  .tn .cap output { font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ivory); letter-spacing: 0; }
  .tn-hero { min-height: 96px; border-radius: 22px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; color: var(--mist);
    background: linear-gradient(160deg, rgba(41,48,65,.84), rgba(21,24,33,.94)); box-shadow: inset 0 0 0 1.5px rgba(243,239,227,.09), 0 8px 18px rgba(0,0,0,.45); }
  .tn-hero.has { color: var(--obsidian-950); background: linear-gradient(158deg, #F4CB6C 0%, var(--brass-400) 42%, var(--brass-500) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 0 0 3px var(--obsidian-950), 0 0 0 5px rgba(224,169,59,.45); }
  .tn-hero.paused { filter: saturate(.55); }
  .tn-hero .lead { display: grid; justify-items: center; min-width: 58px; }
  .tn-hero .lead i { font: 800 10px/1 var(--ui); font-style: normal; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .tn-hero .lead b { font: 700 52px/.95 var(--display); font-variant-numeric: lining-nums; }
  .tn-hero.has .lead b, .tn-hero.has .mid b { color: var(--obsidian-950); }
  .tn-hero .mid { flex: 1; min-width: 0; display: grid; gap: 4px; padding-left: 14px; border-left: 2px solid rgba(11,13,18,.18); }
  .tn-hero:not(.has) .mid { border-left-color: rgba(243,239,227,.14); }
  .tn-hero .mid b { font: 700 28px/1 var(--display); color: var(--ivory); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn-hero .mid i { font: 800 11px/1 var(--ui); font-style: normal; letter-spacing: .1em; text-transform: uppercase; }
  .tn-hero .acts { display: flex; align-items: center; gap: 8px; flex: none; }
  .tn-b { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(11,13,18,.28); color: inherit; }
  .tn-b svg { width: 22px; height: 22px; }
  .tn-b.pause[aria-checked="true"] { background: var(--obsidian-950); color: var(--brass-400); }
  .tn-go { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--obsidian-950); color: var(--brass-400);
    box-shadow: 0 6px 14px rgba(0,0,0,.4), inset 0 0 0 2px rgba(224,169,59,.55); }
  .tn-go svg { width: 26px; height: 26px; }
  .tn-p { --c: #3B4699; display: grid; grid-template-columns: minmax(96px, 1.1fr) minmax(0, 3fr) auto; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 16px; }
  .tn-p + .tn-p { margin-top: 6px; }
  .tn-p .nm { display: grid; gap: 2px; min-width: 0; }
  .tn-p .nm b { font: 700 15px/1.1 var(--ui); color: var(--ivory); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn-p .nm i { font: 800 9.5px/1 var(--ui); font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-400); }
  .tn-p .bar { height: 12px; border-radius: 999px; background: rgba(11,13,18,.55); overflow: hidden; }
  .tn-p .bar i { display: block; height: 100%; border-radius: 999px; background: var(--c); }
  .tn-p output { font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ivory); }
  .tn-p.on { background: rgba(224,169,59,.12); box-shadow: inset 0 0 0 1.5px rgba(224,169,59,.4); }
  .tn-p.out { opacity: .45; } .tn-p.out .nm i { color: var(--mist-dim); }
  .winner { position: absolute; bottom: calc(100% + 10px); left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; background: var(--ivory); color: var(--obsidian-950); border-radius: 999px; padding: 4px 4px 4px 14px; font: 700 13px/1 var(--ui); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  /* quem fica com a peça: a peça é o herói; cada jogador é um card na cor dele.
     "ninguém" não é botão de rodapé, é a peça vazia da mesma grade. */
  .sheet-body.tk { gap: 14px; }
  .tk-hero { --c: #4A5260; position: relative; overflow: hidden; min-height: 96px; border-radius: 22px; display: flex; align-items: center; gap: 16px; padding: 12px 18px; color: var(--mist);
    background: rgba(21,24,33,.74); outline: 2px dashed rgba(224,169,59,.5); outline-offset: -2px; }
  /* a marca d'água da própria peça ancora o lado direito do herói, que senão fica vazio */
  .tk-hero .marca { position: absolute; right: 18px; top: 50%; translate: 0 -50%; width: 116px; height: 116px; opacity: .17; pointer-events: none; }
  .tk-hero .marca svg { width: 116px; height: 116px; }
  .tk-hero.has { color: var(--ivory); outline: none;
    background: linear-gradient(152deg, color-mix(in srgb, var(--c) 86%, #fff) 0%, var(--c) 46%, color-mix(in srgb, var(--c) 62%, #000) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.42); }
  .tk-hero .face { width: 56px; height: 56px; flex: none; display: grid; place-items: center; color: var(--brass-400); }
  .tk-hero.has .face { color: var(--ivory); }
  .tk-hero .face svg { width: 48px; height: 48px; }
  .tk-hero .txt { display: grid; gap: 4px; min-width: 0; }
  .tk-hero b { font: 700 30px/1.15 var(--display); color: var(--ivory); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-hero i { font: 800 11px/1.25 var(--ui); font-style: normal; letter-spacing: .1em; text-transform: uppercase; }
  .tk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
  .tk-p { --c: #4A5260; min-height: 88px; border-radius: 18px; padding: 10px; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--ivory);
    background: linear-gradient(152deg, color-mix(in srgb, var(--c) 86%, #fff) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 60%, #000) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.16), 0 6px 14px rgba(0,0,0,.36); }
  .tk-p .mk { height: 26px; display: grid; place-items: center; }
  .tk-p .mk svg { width: 26px; height: 26px; }
  .tk-p b { font: 700 14px/1.15 var(--ui); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-p i { min-height: 10px; font: 800 9.5px/1.1 var(--ui); font-style: normal; letter-spacing: .1em; text-transform: uppercase; }
  .tk-p.on { box-shadow: inset 0 1.5px 0 rgba(255,255,255,.2), 0 0 0 3px var(--obsidian-950), 0 0 0 5px var(--brass-400), 0 10px 22px rgba(224,169,59,.24); }
  .tk-p.out { filter: saturate(.4) brightness(.72); }
  .tk-p.livre { background: rgba(21,24,33,.74); box-shadow: 0 6px 14px rgba(0,0,0,.36); outline: 2px dashed rgba(224,169,59,.5); outline-offset: -2px; color: var(--mist); }
  .tk-p.livre .mk { color: var(--brass-400); }
  .tk-p.livre.on { outline: none; box-shadow: 0 0 0 3px var(--obsidian-950), 0 0 0 5px var(--brass-400); }

  /* partidas guardadas: cada partida é uma ficha na cor de quem venceu */
  .sheet-body.hx { gap: 14px; }
  .hx-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .hx-g { --c: #4A5260; position: relative; border-radius: 22px; min-height: 126px; overflow: hidden;
    background: linear-gradient(152deg, color-mix(in srgb, var(--c) 86%, #fff) 0%, var(--c) 46%, color-mix(in srgb, var(--c) 62%, #000) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.42); }
  .hx-g.hero { grid-column: 1 / -1; min-height: 142px; }
  .hx-g.livre { background: rgba(21,24,33,.74); box-shadow: 0 8px 18px rgba(0,0,0,.42); outline: 2px dashed rgba(224,169,59,.5); outline-offset: -2px; }
  /* três faixas fixas: mesa em miniatura, nome, e rodapé com data à esquerda e duração à direita.
     nada fica solto em cima de nada — foi assim que o nome parou de ser cortado pela data */
  .hx-open { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto;
    column-gap: 10px; row-gap: 6px; align-items: center; padding: 12px 14px; text-align: left; color: var(--ivory); }
  .hx-seats { grid-area: 1 / 1; display: flex; flex-wrap: wrap; gap: 5px; max-width: calc(100% - 42px); }
  .hx-seats i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  .hx-seats i.w { box-shadow: 0 0 0 2px var(--obsidian-950), 0 0 0 3.5px var(--brass-400); }
  /* o nome mora só na coluna da esquerda: na coluna da direita ficam o ✕ e a duração,
     e um nome comprido não pode terminar embaixo deles */
  .hx-g .ttl { grid-area: 2 / 1; align-self: end; display: grid; gap: 4px; min-width: 0; }
  /* entrelinha 1.2: com 1.05 a serifa encostava e a caixa cortava 2px do topo do nome */
  .hx-g b { font: 600 20px/1.2 var(--display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hx-g.hero b { font-size: 32px; }
  .hx-g.livre b { color: var(--mist); }
  .hx-g .say { font: 500 13px/1.3 var(--ui); font-style: normal; color: var(--ivory); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* o rodapé da ficha é uma linha só: data e gente à esquerda, duração à direita, sempre na mesma altura */
  .hx-g .meta { grid-area: 3 / 1; align-self: end; display: flex; flex-wrap: nowrap; gap: 10px; overflow: hidden;
    font: 800 10px/1.25 var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--ivory); }
  .hx-g .meta em { font-style: normal; white-space: nowrap; }
  .hx-g.livre .meta { color: var(--mist-dim); }
  .hx-g .dur { grid-area: 3 / 2; justify-self: end; align-self: end; font: 700 24px/1 var(--display);
    font-variant-numeric: lining-nums tabular-nums; color: var(--ivory); text-shadow: 0 1px 4px rgba(11,13,18,.5); }
  .hx-g.hero .dur { font-size: 32px; }
  .hx-g.livre .dur { color: var(--mist); text-shadow: none; }
  .hx-x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: var(--ivory); background: rgba(11,13,18,.38); }
  .hx-x svg { width: 18px; height: 18px; }
  .hx-x.is-armed { background: var(--vinho); box-shadow: 0 0 0 2px var(--obsidian-950), 0 0 0 4px rgba(158,52,74,.55); }
  .hx-empty { border-radius: 22px; outline: 2px dashed rgba(224,169,59,.45); outline-offset: -2px; min-height: 168px;
    display: grid; place-items: center; align-content: center; gap: 10px; padding: 22px; text-align: center; }
  .hx-empty svg { width: 42px; height: 42px; color: var(--brass-400); }
  .hx-empty b { font: 600 21px/1.1 var(--display); color: var(--ivory); }
  .hx-empty span { font: 500 13px/1.45 var(--ui); color: var(--mist); max-width: 36ch; }

  /* resultado: cada jogador é um card na cor dele, com a vida em numeral */
  .rs { display: grid; gap: 8px; }
  .rs-cap { margin: 0; font: 800 11px/1.5 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
  .rs-p { --c: #4A5260; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
    border-radius: 18px; padding: 10px 14px; color: var(--ivory);
    background: linear-gradient(152deg, color-mix(in srgb, var(--c) 86%, #fff) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 60%, #000) 100%);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.16), 0 6px 14px rgba(0,0,0,.36); }
  .rs-p .num { font: 700 34px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; min-width: 58px; text-align: center; }
  .rs-p .who { display: grid; gap: 3px; min-width: 0; }
  .rs-p .who b { font: 700 15px/1.15 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rs-p .who i { font: 500 12px/1.3 var(--ui); font-style: normal; color: var(--ivory); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rs-p .tags { display: flex; gap: 6px; flex: none; }
  .rs-p .tags em { font: 800 10px/1 var(--ui); font-style: normal; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(11,13,18,.36); border-radius: 999px; padding: 6px 9px; white-space: nowrap; }
  .rs-p .tags em.won { background: var(--brass-400); color: var(--obsidian-950); }
  .rs-p.win { box-shadow: inset 0 1.5px 0 rgba(255,255,255,.2), 0 0 0 3px var(--obsidian-950), 0 0 0 5px var(--brass-400), 0 10px 22px rgba(224,169,59,.24); }
  .rs-p.win .num { font-size: 46px; }
  .rs-p.out { filter: saturate(.42) brightness(.74); }
  .winner button { min-height: 40px; background: var(--obsidian-950); color: var(--ivory); border-radius: 999px; padding: 0 14px; font: 600 12px/1 var(--ui); }

  /* ── sheets ───────────────────────────────────────────── */
  .scrim { display: none; }        /* a folha cobre a mesa inteira: não há "fora" para escurecer */
  /* Sem janela sobre a mesa: a folha É a tela, de ponta a ponta, com uma saída só.
     É assim que o contador que estamos igualando faz — nada de caixa flutuante com véu atrás. */
  .sheet {
    position: absolute; z-index: 5; inset: 0;
    display: flex; flex-direction: column; box-sizing: border-box;
    padding: var(--tt) var(--tr) var(--tb) var(--tl);
    background: radial-gradient(ellipse at 50% 40%, rgba(11,13,18,.80), rgba(11,13,18,.93));
    -webkit-backdrop-filter: blur(8px) saturate(.8); backdrop-filter: blur(8px) saturate(.8);
    animation: fade .16s ease;
  }
  .sheet:focus { outline: none; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 10px 6px 18px; flex: none;
    width: min(100%, 560px); margin-inline: auto; box-sizing: border-box; }   /* mesma coluna do conteúdo */
  .sheet-head h2 { margin: 0; font: 600 22px/1.15 var(--display); text-wrap: balance; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sheet-head .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--mist); flex: none; }
  .back:hover { background: var(--slate-850); color: var(--ivory); }
  .back svg { width: 20px; height: 20px; }
  .x { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ivory); flex: none;
    background: var(--slate-850); box-shadow: inset 0 0 0 1px var(--slate-750); }
  .x:hover { background: var(--slate-750); }
  .x svg { width: 18px; height: 18px; }
  .sheet-body { overflow-y: auto; padding: 4px 18px 18px; display: grid; gap: 16px; overscroll-behavior: contain;
    align-content: start; width: min(100%, 560px); margin-inline: auto; }
  /* a ação principal da tela é rodapé de verdade: fica fora da rolagem e nunca cobre conteúdo */
  .sheet > .btns { flex: none; align-self: center; width: 100%; max-width: 560px; padding: 10px 18px 14px;
    box-sizing: border-box; border-top: 1px solid rgba(243,239,227,.10); background: transparent; }
  .group { display: grid; gap: 8px; }

    if (!sheet.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o && !sheetKind && !o.closest('.panel')) openSheet(o.dataset.open, null, o);
  });

  function gameInProgress() {
    return state.players.some(function (p) {
      return p.life !== state.startLife || p.conceded || maxCmd(p) > 0 || COUNTERS.some(function (c) { return (p.c[c[0]] || 0) > 0; });
    });
  }
  sheet.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, p = sheetArg ? player(sheetArg) : null;
    if (act === 'close') return closeSheet();
    if (act === 'summary') { sheetKind = 'summary'; sheetArg = null; return drawSheet('.x'); }
    if (act === 'savepost') { archiveGame('fim'); closeSheet(); return toast('Partida guardada'); }
    if (act === 'history') { sheetKind = 'history'; sheetArg = null; backTo = 'menuback'; return drawSheet('.x'); }
    if (act === 'plane') { sheetKind = 'plane'; sheetArg = null; backTo = 'mesaback'; return drawSheet('.x'); }
    if (act === 'pcmode') { setMode('planechase', !state.planechase); return drawSheet('[data-act="pcmode"]'); }
    if (act === 'aemode') { setMode('archenemy', !state.archenemy); return drawSheet('[data-act="aemode"]'); }
    if (act === 'planarroll') { planarRoll(); return drawSheet('[data-act="planarroll"]'); }
    if (act === 'chaos') { changeChaos(Number(b.dataset.d)); return drawSheet('[data-act="chaos"][data-d="' + b.dataset.d + '"]'); }
    if (act === 'scheme') { changeSchemes(Number(b.dataset.d)); return drawSheet('[data-act="scheme"][data-d="' + b.dataset.d + '"]'); }
    if (act === 'setarch') { setArch(b.dataset.p || null); return drawSheet('[data-act="setarch"]'); }
    if (act === 'daynight') { setDayNight(b.dataset.v); return drawSheet('[data-act="daynight"][data-v="' + b.dataset.v + '"]'); }
    if (act === 'token') { sheetKind = 'token'; sheetArg = b.dataset.k; backTo = 'mesaback'; return drawSheet('.x'); }
    if (act === 'givetok') { giveToken(b.dataset.k, b.dataset.p || null); return drawSheet('[data-act="givetok"][data-p="' + b.dataset.p + '"]'); }
    if (act === 'hopen') { sheetKind = 'match'; sheetArg = b.dataset.s; backTo = 'history'; return drawSheet('.x'); }
    if (act === 'hdel') {
      var chave = 'hdel:' + b.dataset.s;
      if (!(newArmed && armedFor === chave && Date.now() - newArmed < ARM_MS)) {
        newArmed = Date.now(); armedFor = chave;
        drawSheet(); var alvo = sheet.querySelector('[data-act="hdel"][data-s="' + b.dataset.s + '"]');
        if (alvo) { alvo.classList.add('is-armed'); alvo.focus(); }
        return toast('Toque de novo para apagar esta partida');
      }
      newArmed = 0; armedFor = '';
      histRemove(b.dataset.s); sheetKind = 'history'; sheetArg = null; backTo = 'menuback';
      drawSheet('.x'); return toast('Partida apagada');
    }
    if (act === 'roll') {
      var sides = Number(b.dataset.sides), v = roll(sides);
      state.rolls.unshift({ kind: sides === 2 ? 'Moeda' : 'd' + sides, value: sides === 2 ? (v === 1 ? 'Cara' : 'Coroa') : String(v) });
      state.rolls = state.rolls.slice(0, 12); save(); announce(state.rolls[0].kind + ': ' + state.rolls[0].value);
      return drawSheet('[data-act="roll"][data-sides="' + sides + '"]');
    }
    if (act === 'highroll') {
      var pool = alive(); if (!pool.length) return toast('Ninguém está na partida');
      var res = pool.map(function (x) { return { id: x.id, name: x.name, color: x.color, value: roll(20) }; });
      for (var guard = 0; guard < 6; guard++) {
        var top = Math.max.apply(null, res.map(function (r) { return r.value; }));
        var tied = res.filter(function (r) { return r.value === top; });
        if (tied.length === 1) break;
        tied.forEach(function (r) { r.value = roll(20); });
      }
      var best = res.reduce(function (a, r) { return r.value > a.value ? r : a; }, res[0]);
      res.forEach(function (r) { r.win = r.id === best.id; });
      res.sort(function (a, b2) { return b2.value - a.value; });
      state.highroll = res; state.starter = best.id; startTurns(best.id);
      state.players.forEach(refreshPanel); save();
      toast(best.name + ' começa'); announce(best.name + ' começa, com ' + best.value);
      return drawSheet('[data-act="highroll"]');
    }
    if (act === 'count' || act === 'start') {
      var val = Number(b.dataset.v);
      var count = act === 'count' ? val : state.players.length, life = act === 'start' ? val : state.startLife;
      if (count === state.players.length && life === state.startLife) return;
      var sel = '[data-act="' + act + '"][data-v="' + val + '"]';
      if (gameInProgress() && !(newArmed && armedFor === sel && Date.now() - newArmed < ARM_MS)) {
        newArmed = Date.now(); armedFor = sel; drawSheet(sel);
        // the number keeps its slot in the row; the amber ring and the toast carry the warning
        var armed = sheet.querySelector(sel);
        if (armed) { armed.classList.add('is-armed'); armed.setAttribute('aria-label', val + ', toque de novo para confirmar'); }
        return toast('Isso encerra a partida atual. Toque de novo para confirmar.');
      }
      newArmed = 0; armedFor = '';
      startGame(count, life); announce('Nova partida: ' + count + ' jogadores, ' + life + ' de vida');
      return drawSheet(sel);
    }
    if (act === 'arranjo') {
      var v = int(b.dataset.v, 0), n = state.players.length;
      if (ARRANJOS(n).indexOf(v) >= 0) { state.seatRow = v; save(); renderTable(); }
      return drawSheet('[data-act="arranjo"][data-v="' + v + '"]');
    }
    if (act === 'startother') { sheetKind = 'startpad'; pad = { digits: '' }; backTo = 'mesaback'; return drawSheet('.x'); }
    if (act === 'menuback') { closeSheet(); return setHub(true); }
    if (act === 'mesaback') { sheetKind = 'mesa'; pad = null; backTo = null; return drawSheet('.x'); }
    if (act === 'turns') { sheetKind = 'turns'; backTo = 'mesaback'; return drawSheet('.x'); }
    if (act === 'turnnext') { passTurn(1); return drawSheet('[data-act="turnnext"]'); }
    if (act === 'turnback') { passTurn(-1); return drawSheet('[data-act="turnback"]'); }
    if (act === 'pause') { setPaused(!state.paused); return drawSheet('[data-act="pause"]'); }
    if (act === 'cmdlife') { state.cmdHurtsLife = !state.cmdHurtsLife; save(); announce('Dano de comandante ' + (state.cmdHurtsLife ? 'desconta' : 'não desconta') + ' da vida'); return drawSheet('[data-act="cmdlife"]'); }
    if (act === 'tapnumber') { state.tapNumber = !state.tapNumber; save(); state.players.forEach(refreshPanel); return drawSheet('[data-act="tapnumber"]'); }
    if (act === 'hold') { state.holdStep = Number(b.dataset.v); save(); state.players.forEach(refreshPanel); return drawSheet('[data-act="hold"][data-v="' + state.holdStep + '"]'); }
    if (act === 'newgame') {
      if (newArmed && armedFor === 'new' && Date.now() - newArmed < ARM_MS) {
        newArmed = 0; armedFor = '';
        startGame(state.players.length, state.startLife); closeSheet(); return toast('Nova partida começou');
      }
      newArmed = Date.now(); armedFor = 'new'; b.textContent = 'Toque de novo para confirmar';
      setTimeout(function () { if (document.contains(b) && armedFor === 'new' && Date.now() - newArmed >= 3400) { newArmed = 0; armedFor = ''; b.textContent = 'Nova partida'; } }, ARM_MS);
      return;
    }
    // keypad: life (no prefix) and starting life (s prefix)
    if (act === 'pad') { sheetKind = 'pad'; pad = { digits: '' }; return drawSheet('.x'); }
    if (act === 'digit' || act === 'back' || act === 'clear' || act === 'padstart' || act === 'padapply' ||
        act === 'sdigit' || act === 'sback' || act === 'sclear' || act === 'sapply') {
      if (!pad) pad = { digits: '' };
      var startSide = act.charAt(0) === 's', maxLen = startSide ? 3 : 4;
      if (act === 'digit' || act === 'sdigit') { if (pad.digits.length < maxLen) pad.digits += b.dataset.n; }
      else if (act === 'back' || act === 'sback') pad.digits = pad.digits.slice(0, -1);
      else if (act === 'clear' || act === 'sclear') pad.digits = '';
      else if (act === 'padstart') pad.digits = String(state.startLife);
      else if (act === 'padapply') {
        if (p && pad.digits !== '') setLife(p.id, Number(pad.digits));
        return closeSheet();
      } else if (act === 'sapply') {
        var nv = clamp(Number(pad.digits || state.startLife), 1, 999);
        pad = null; sheetKind = 'mesa';
        startGame(state.players.length, nv); announce('Nova partida com ' + nv + ' de vida');
        return drawSheet('.x');
      }
      return drawSheet('[data-act="' + act + '"]' + (act === 'digit' || act === 'sdigit' ? '[data-n="' + b.dataset.n + '"]' : ''));
    }
    if (!p) return;
    if (act === 'toggle-counter') {
      var id = b.dataset.c, i = p.add.indexOf(id);
      if (i >= 0) { p.add.splice(i, 1); delete p.c[id]; } else p.add.push(id);
      refreshPanel(p); save();
      return drawSheet('[data-act="toggle-counter"][data-c="' + id + '"]');
    }
    if (act === 'revive') { revive(p.id); return closeSheet(); }
    if (act === 'step') {
      var dd = Number(b.dataset.d);
      commit('life:' + p.id + (dd > 0 ? '+' : '-'));
      p.life += dd; showDelta(p.id, dd); refreshPanel(p); refreshWinner(); save(); announce(p.name + ': ' + p.life + ' de vida');
      return drawSheet('[data-act="step"][data-d="' + dd + '"]');
    }
    if (act === 'concede') { commit('concede:' + p.id + ':' + Date.now()); p.conceded = !p.conceded; refreshPanel(p); refreshWinner(); save(); return drawSheet('[data-act="concede"]'); }
    if (act === 'monarch') { toggleMonarch(p.id); return drawSheet('[data-act="monarch"]'); }
    if (act === 'winner') { setWinner(p.id); return drawSheet('[data-act="winner"]'); }
    if (act === 'initiative') { toggleInitiative(p.id); return drawSheet('[data-act="initiative"]'); }
    if (act === 'partner') { setPartner(p.id, !p.cmdr2); return drawSheet('[data-act="partner"]'); }
    if (act === 'cmdkind') { setPartnerKind(p.id, b.dataset.v); return drawSheet('[data-act="cmdkind"][data-v="' + b.dataset.v + '"]'); }
    if (act === 'page') { setPage(p.id, b.dataset.p); closeSheet(); return; }
    if (act === 'color') { p.color = color(b.dataset.c).id; refreshPanel(p); save(); return drawSheet('[data-act="color"][data-c="' + p.color + '"]'); }
  });
  sheet.addEventListener('input', function (e) {
    if (e.target.id === 'pPlane') { setPlane(e.target.value); return; }
    var p = player(sheetArg); if (!p) return;
    if (e.target.id === 'pName') {
      p.name = e.target.value.trim().slice(0, 18) || 'Jogador';
      refreshPanel(p); refreshWinner(); save();
      var t = sheet.querySelector('#sheetTitle'); if (t) t.textContent = p.name;
      return;
    }
    if (e.target.id === 'pPlane') { setPlane(e.target.value); return; }
    if (e.target.id === 'pCmdr2') {
      p.cmdr2 = e.target.value.trim().slice(0, 60) || 'Segundo comandante';
      refreshPanel(p); save(); return;
    }
    var key = e.target.id === 'pLose' ? 'loseMsg' : (e.target.id === 'pWin' ? 'winMsg' : null);
    if (!key) return;
    // never rewrite e.target.value here: on iOS that drops the caret mid-word
    p[key] = e.target.value.replace(/\s+/g, ' ').replace(/^ /, '').slice(0, MSG_MAX);
    refreshPanel(p); save();
  });

  function startGame(count, startLife) {
    archiveGame('nova');                      // a partida que sai vira recibo antes de a mesa ser trocada
    commit('newgame:' + Date.now());
    state = freshState(clamp(count, MIN_PLAYERS, MAX_PLAYERS), clamp(startLife, 1, 999), state.players);
    deltas = {}; ui = { page: {}, cmdFor: null }; renderTable(); save();
  }

  // ── who starts: the rail keeps the quick draw, the dice sheet has the high roll ──
  var drawing = false;
  $('#btnTurn').addEventListener('click', function () { passTurn(1); setHub(true); });
  $('#btnPlane').addEventListener('click', function () { openSheet('plane', null, $('#btnPlane')); });
  $('#btnDayNight').addEventListener('click', function () {
    if (state.daynight === 'none') setDayNight('day'); else flipDayNight();
    setHub(true);
  });
  $('#btnStarter').addEventListener('click', function () {
    if (drawing) return;
    setHub(false);
    var pool = alive();
    if (!pool.length) return toast('Ninguém está na partida');
    var pick = pool[Math.floor(Math.random() * pool.length)], game = state.startedAt;
    var clear = function () { table.querySelectorAll('.is-pick').forEach(function (n) { n.classList.remove('is-pick'); }); };
    var finish = function () {
      clear(); drawing = false;
      var still = state.startedAt === game && player(pick.id); // the game may have changed while the draw was running
      if (!still || outReason(still)) return;
      state.starter = pick.id; state.highroll = null;
      startTurns(pick.id);                       // sortear quem começa abre o turno 1 dessa pessoa
      state.players.forEach(refreshPanel); save();
      toast(still.name + ' começa'); announce(still.name + ' começa');
    };
    if (reduceMotion || pool.length === 1) return finish();
    drawing = true;
    var steps = pool.length * 2 + pool.indexOf(pick), i = 0;
    (function tick() {
      clear();
      if (state.startedAt !== game) { drawing = false; return; }
      var el = panelEl(pool[i % pool.length].id);
      if (el) el.classList.add('is-pick');
      if (i >= steps) return setTimeout(finish, 350);
      i++; setTimeout(tick, 70 + i * 14);
    })();
  });
  $('#btnUndo').addEventListener('click', undo);

  // ── misc ─────────────────────────────────────────────────
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
  }
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  }
  function refreshTop() {
    if (!state) return;
    var txt = fmt(matchMs());
    if (state.turn) txt = 'Turno ' + state.turnNo + ' · ' + txt;
    if (state.paused) txt = 'Pausado · ' + txt;
    $('#clock').textContent = txt;
    var b = $('#btnTurn'); if (b) b.setAttribute('aria-label', state.turn ? 'Passar a vez (turno ' + state.turnNo + ', ' + player(state.turn).name + ')' : 'Começar os turnos');
    if (sheetKind === 'turns') sheet.querySelectorAll('[data-ms]').forEach(function (o) {
      var pl = player(o.dataset.ms); if (pl) o.textContent = fmt(msOf(pl));
      if (o.dataset.ms === 'total') o.textContent = fmt(matchMs());
    });
  }
  setInterval(refreshTop, 1000);

  // A native host knows the real safe area better than the web view does.
  window.addEventListener('resize', centreHub);
  window.__setInsets = function (l, t, r, b) {
    var s = document.documentElement.style;
    [['--sl', l], ['--st', t], ['--sr', r], ['--sb', b]].forEach(function (pair) { s.setProperty(pair[0], Math.max(0, Number(pair[1]) || 0) + 'px'); });
  };
  // Read-only window for automated checks.
  window.__mesa = {
    state: function () { return JSON.parse(JSON.stringify(state)); },
    view: function () { return { cmdFor: ui.cmdFor, page: JSON.parse(JSON.stringify(ui.page)), sheet: sheetKind, undo: undoStack.length, hubOpen: hubwrap.classList.contains('open') }; },
    out: function (id) { var p = player(id); return p ? outReason(p) : null; },
    winner: function () { var w = winnerOf(); return w ? w.id : null; },
    counters: function () { return COUNTERS.map(function (c) { return c[0]; }); },
    hist: function () { return histLoad(); },
    arranjos: function (n) { return ARRANJOS(n); },
    plane: function () { return { on: !!state.planechase, name: state.plane.name, chaos: state.plane.chaos, walks: state.plane.walks,
      rolls: state.plane.rolls, recent: state.plane.recent.slice(), arch: !!state.archenemy, schemes: state.schemes || 0,
      archOf: (archOf() || {}).id || null }; },
    daynight: function () { return { mode: state.daynight, flips: state.dnFlips || 0 }; },
    tokens: function () {
      var o = { carry: Object.keys(carries).length };
      Object.keys(TOKENS).forEach(function (k) { var d = holderOf(k); o[k] = d ? d.id : null; });
      return o;
    },
    duo: function (id) { var p = player(id); return p ? twoSources(p) : false; },
    times: function () { var o = { total: matchMs(), turn: state.turn, turnNo: state.turnNo, paused: !!state.paused, round: roundNo() };
      state.players.forEach(function (p) { o[p.id] = msOf(p); }); return o; }
  };

  function start(data) {
    state = (data && data.state && sanitize(data.state)) || load();
    if (!state) {
      // Open mid-game so the first look shows what the table does (example values).
      state = freshState(4, 40);
      state.startedAt = Date.now() - 17 * 60000;
      var p = state.players;
      p[0].life = 34; p[0].c.tax = 2;
      p[1].life = 27; p[1].cmd.p1 = 6; p[1].paid.p1 = 6; p[1].monarch = true;
      p[2].life = 41; p[2].c.poison = 3;
      p[3].life = 9; p[3].cmd.p2 = 14; p[3].paid.p2 = 14; p[3].cmd.p3 = 5; p[3].paid.p3 = 5;
      state.starter = 'p2';
    }
    renderTable();
    refreshTop();
    var seen = false;
    try { seen = localStorage.getItem(STORE + '.hint') === '1'; localStorage.setItem(STORE + '.hint', '1'); } catch (e) {}
    if (!seen) setTimeout(function () { if (!sheetKind && !hubwrap.classList.contains('open')) toast('Arraste o card: dano de comandante ou marcadores'); }, 1400);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { state: state }; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
