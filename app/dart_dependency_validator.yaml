exclude:
  # Generated outputs and platform registrants are dependency consumers of the
  # toolchain/plugins, not source dependencies declared by the ManaLoom app.
  - .dart_tool/**
  - build/**
  - ios/Flutter/ephemeral/**
  - linux/flutter/ephemeral/**
  - macos/Flutter/ephemeral/**
  - windows/flutter/ephemeral/**
  # Patrol creates these entrypoints during device/web runs. They import
  # package:test_api as generated implementation detail, not an app contract.
  - test_bundle.dart
  - patrol_test/test_bundle.dart

ignore:
  - manaloom_lints
  # Flutter's Web build resolves the Cupertino icon font through this package;
  # it is an asset dependency even though app Dart code does not import it.
  - cupertino_icons
  # `package:file` é usado só em test/core/widgets/cached_card_image_test.dart,
  # porque `FileInfo`, do flutter_cache_manager, exige um `file.File` — não
  # serve `dart:io`. O teste usa deliberadamente a versão que o próprio
  # flutter_cache_manager trava, e diz isso com um
  # `// ignore: depend_on_referenced_packages` logo acima do import.
  #
  # Declarar `file:` aqui como dev_dependency cria uma SEGUNDA fonte de verdade
  # para essa versão: medido, `file: ^7.0.1` faz o solver rebaixar `meta`
  # 1.18.0 -> 1.17.0 e `test_api` 0.7.11 -> 0.7.10, e esse par rebaixado quebra
  # o build de integration_test com
  # `_TestFlutterView implements FlutterView` sem `displayCornerRadii`. Sem a
  # declaração, o mesmo `pub get` mantém 1.18.0.
  - file
